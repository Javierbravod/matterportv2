<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="viewport"
        content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0, shrink-to-fit=no">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>BIM+NP</title>
    <!-- Import Map: Three.js + GLTFLoader como ES Modules -->
    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.150.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.150.0/examples/jsm/"
        }
    }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            width: 100%;
            height: 100vh;
            overflow: hidden;
            font-family: 'Inter', 'Segoe UI', sans-serif;
        }

        /* ── SIDEBAR PANEL ── */
        #checklist-panel {
            display: none;
            position: fixed;
            top: 0;
            right: 0;
            width: 300px;
            height: 100vh;
            background: #1c1c1e;
            z-index: 99999;
            pointer-events: auto;
            flex-direction: column;
            overflow: hidden;
        }

        #checklist-panel.visible {
            display: flex;
        }

        /* Header */
        .panel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 18px 20px 14px 20px;
            border-bottom: 1px solid #2c2c2e;
            flex-shrink: 0;
        }

        .panel-header-label {
            font-size: 13px;
            font-weight: 600;
            color: #ffffff;
            letter-spacing: 0.2px;
        }

        .close-btn {
            background: none;
            border: none;
            color: #8e8e93;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: color 0.2s, background 0.2s;
        }

        .close-btn:hover {
            background: #2c2c2e;
            color: #ffffff;
        }

        /* Step title */
        .panel-step-block {
            padding: 16px 20px 12px 20px;
            border-bottom: 1px solid #2c2c2e;
            flex-shrink: 0;
        }

        .panel-step-title {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 8px;
        }

        .step-emoji {
            font-size: 18px;
            line-height: 1;
        }

        .step-title-text {
            font-size: 15px;
            font-weight: 700;
            color: #ffffff;
            line-height: 1.3;
        }

        .step-objective {
            font-size: 12px;
            color: #8e8e93;
            line-height: 1.5;
            padding-left: 2px;
        }

        /* Items container */
        .checklist-items-wrap {
            flex: 1;
            overflow-y: auto;
            padding: 12px 20px 20px;
            scrollbar-width: thin;
            scrollbar-color: #3a3a3c #1c1c1e;
        }

        .checklist-items-wrap::-webkit-scrollbar {
            width: 4px;
        }

        .checklist-items-wrap::-webkit-scrollbar-track {
            background: #1c1c1e;
        }

        .checklist-items-wrap::-webkit-scrollbar-thumb {
            background: #3a3a3c;
            border-radius: 2px;
        }

        /* Individual item */
        .checklist-item {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            padding: 10px 0;
            cursor: pointer;
            border-bottom: 1px solid #2c2c2e;
            transition: opacity 0.2s;
        }

        .checklist-item:last-child {
            border-bottom: none;
        }

        .checklist-item:hover {
            opacity: 0.85;
        }

        .check-box {
            width: 16px;
            height: 16px;
            min-width: 16px;
            border: 1.5px solid #636366;
            border-radius: 3px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-top: 2px;
            transition: all 0.2s;
            background: transparent;
        }

        .checklist-item.checked .check-box {
            background: #22c55e;
            border-color: #22c55e;
        }

        .check-icon {
            display: none;
            color: white;
            font-size: 10px;
            font-weight: 800;
        }

        .checklist-item.checked .check-icon {
            display: block;
        }

        .item-text {
            font-size: 13px;
            line-height: 1.5;
            color: #d1d1d6;
        }

        .checklist-item.checked .item-text {
            color: #636366;
            text-decoration: line-through;
        }

        .item-text strong {
            color: #ffffff;
            font-weight: 600;
        }

        .checklist-item.checked .item-text strong {
            color: #636366;
        }

        /* Progress footer */
        .panel-footer {
            padding: 14px 20px;
            border-top: 1px solid #2c2c2e;
            flex-shrink: 0;
        }

        .progress-label {
            font-size: 11px;
            color: #8e8e93;
            margin-bottom: 6px;
        }

        .progress-bar-wrap {
            height: 4px;
            background: #3a3a3c;
            border-radius: 2px;
            overflow: hidden;
        }

        .progress-bar-fill {
            height: 100%;
            background: #22c55e;
            border-radius: 2px;
            transition: width 0.4s ease;
        }

        /* ── NUMBERED ICONS on the map ── */
        .mp-tag-number {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            font-weight: 700;
            color: #fff;
            border: 2px solid rgba(255, 255, 255, 0.8);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.5);
        }

        /* ── BOTONES DE MODELOS BIM ── */
        .model-toggle-btn {
            z-index: 9999;
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 16px;
            background: rgba(28, 28, 30, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 20px;
            cursor: pointer;
            font-family: 'Inter', sans-serif;
            font-size: 13px;
            font-weight: 600;
            color: #ffffff;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
            transition: all 0.25s ease;
            user-select: none;
        }

        .model-toggle-btn:hover {
            background: rgba(44, 44, 46, 0.95);
            border-color: rgba(255, 255, 255, 0.25);
            transform: translateY(-1px);
        }

        .fbx-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #22c55e;
            box-shadow: 0 0 6px #22c55e;
            transition: all 0.3s ease;
            flex-shrink: 0;
        }

        .model-toggle-btn.off .fbx-dot {
            background: #636366;
            box-shadow: none;
        }

        .model-toggle-btn.off {
            opacity: 0.7;
        }

        /* Botones laterales generados dinámicamente */
        #sidebar-models {
            position: fixed;
            left: 24px;
            top: 80px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            z-index: 9999;
        }

        /* ── SWEEP ID WIDGET ── */
        #sweep-id-widget {
            display: none; /* Desactivado por solicitud */
            flex-direction: column;
            gap: 4px;
            margin-top: 4px;
        }

        #sweep-id-label {
            font-size: 10px;
            font-weight: 600;
            color: #8e8e93;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            padding-left: 4px;
        }

        #sweep-id-display {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 8px 12px;
            background: rgba(0, 0, 0, 0.55);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.10);
            border-radius: 10px;
            cursor: pointer;
            transition: border-color 0.2s, background 0.2s;
            user-select: none;
            min-width: 180px;
        }

        #sweep-id-display:hover {
            border-color: rgba(74, 222, 128, 0.5);
            background: rgba(0, 0, 0, 0.75);
        }

        #sweep-id-display:active {
            border-color: #4ade80;
        }

        #sweep-id-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #4ade80;
            box-shadow: 0 0 6px #4ade80;
            flex-shrink: 0;
            animation: sweep-pulse 2s infinite;
        }

        @keyframes sweep-pulse {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: 0.4;
            }
        }

        #sweep-id-value {
            font-family: 'Courier New', monospace;
            font-size: 11px;
            color: #4ade80;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            flex: 1;
        }

        #sweep-copy-icon {
            font-size: 13px;
            opacity: 0.5;
            flex-shrink: 0;
            transition: opacity 0.2s;
        }

        #sweep-id-display:hover #sweep-copy-icon {
            opacity: 1;
        }

        #sweep-copy-toast {
            font-size: 10px;
            color: #4ade80;
            text-align: center;
            height: 14px;
            transition: opacity 0.3s;
            opacity: 0;
        }

        #sweep-copy-toast.show {
            opacity: 1;
        }

        /* ── ROTATION WIDGET ── */
        #rotation-widget {
            display: none; /* Desactivado por solicitud */
            flex-direction: column;
            gap: 4px;
            margin-top: 4px;
        }

        #rotation-label {
            font-size: 10px;
            font-weight: 600;
            color: #8e8e93;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            padding-left: 4px;
        }

        #rotation-display {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 8px 12px;
            background: rgba(0, 0, 0, 0.55);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.10);
            border-radius: 10px;
            cursor: pointer;
            transition: border-color 0.2s, background 0.2s;
            user-select: none;
            min-width: 180px;
        }

        #rotation-display:hover {
            border-color: rgba(96, 165, 250, 0.5);
            background: rgba(0, 0, 0, 0.75);
        }

        #rotation-display:active {
            border-color: #60a5fa;
        }

        #rotation-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #60a5fa;
            box-shadow: 0 0 6px #60a5fa;
            flex-shrink: 0;
            animation: sweep-pulse 2s infinite;
        }

        #rotation-value {
            font-family: 'Courier New', monospace;
            font-size: 11px;
            color: #60a5fa;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            flex: 1;
        }

        #rotation-copy-icon {
            font-size: 13px;
            opacity: 0.5;
            flex-shrink: 0;
            transition: opacity 0.2s;
        }

        #rotation-display:hover #rotation-copy-icon {
            opacity: 1;
        }

        #rotation-copy-toast {
            font-size: 10px;
            color: #60a5fa;
            text-align: center;
            height: 14px;
            transition: opacity 0.3s;
            opacity: 0;
        }

        #rotation-copy-toast.show {
            opacity: 1;
        }

        /* ── NEXT STEP BUTTON ── */
        .next-step-btn {
            background-color: #22c55e;
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 14px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            transition: background 0.3s;
            margin-top: 16px;
        }

        .next-step-btn:hover {
            background-color: #16a34a;
        }

        /* ── ADVANCE TRAINING BUTTON ── */
        #advance-training-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            margin-top: 16px;
            padding: 12px 16px;
            background: linear-gradient(135deg, #22c55e 0%, #16a34a 100%);
            border: none;
            border-radius: 12px;
            cursor: pointer;
            font-family: 'Inter', 'Segoe UI', sans-serif;
            font-size: 14px;
            font-weight: 700;
            color: #ffffff;
            letter-spacing: 0.2px;
            box-shadow: 0 4px 16px rgba(34, 197, 94, 0.35);
            transition: all 0.25s ease;
            user-select: none;
        }

        #advance-training-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(34, 197, 94, 0.5);
            background: linear-gradient(135deg, #4ade80 0%, #22c55e 100%);
        }

        #advance-training-btn:active {
            transform: translateY(0);
            box-shadow: 0 2px 8px rgba(34, 197, 94, 0.3);
        }

        #advance-training-btn.finalizar {
            background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
            box-shadow: 0 4px 16px rgba(245, 158, 11, 0.35);
        }

        #advance-training-btn.finalizar:hover {
            background: linear-gradient(135deg, #fbbf24 0%, #f59e0b 100%);
            box-shadow: 0 6px 20px rgba(245, 158, 11, 0.5);
        }

        #advance-training-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        /* ── PANEL DE CALIBRACIÓN BIM (Draggable) ── */
        #calib-panel {
            position: fixed;
            top: 20px;
            left: calc(100vw - 300px);
            /* posición inicial cerca de la derecha */
            z-index: 9999;
            background: rgba(28, 28, 30, 0.92);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 12px;
            padding: 0 0 15px 0;
            color: white;
            font-family: 'Inter', sans-serif;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6);
            display: none; /* Desactivado por solicitud */
            flex-direction: column;
            gap: 0;
            min-width: 250px;
            user-select: none;
        }

        .calib-header {
            font-size: 13px;
            font-weight: 700;
            text-align: center;
            border-bottom: 1px solid #444;
            padding: 12px 16px;
            cursor: grab;
            background: rgba(255, 255, 255, 0.04);
            border-radius: 12px 12px 0 0;
            letter-spacing: 0.3px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .calib-header:active {
            cursor: grabbing;
        }

        .calib-header::before {
            content: '⠿';
            font-size: 16px;
            opacity: 0.4;
        }

        .calib-body {
            padding: 12px 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .calib-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            font-size: 13px;
        }

        .calib-btn {
            background: #3a3a3c;
            border: 1px solid #636366;
            color: white;
            border-radius: 4px;
            width: 30px;
            height: 30px;
            cursor: pointer;
            font-weight: bold;
        }

        .calib-btn:hover {
            background: #22c55e;
            border-color: #22c55e;
            color: black;
        }

        .calib-input {
            background: #1c1c1e;
            color: white;
            border: 1px solid #636366;
            border-radius: 4px;
            padding: 4px;
            width: 60px;
            text-align: center;
            font-size: 12px;
        }

        .calib-select {
            background: #1c1c1e;
            color: white;
            border: 1px solid #636366;
            border-radius: 4px;
            padding: 4px;
            font-size: 12px;
            width: 100%;
        }

        /* Colapso del cuerpo */
        #calib-panel.collapsed #calib-panel-body {
            display: none;
        }

        #calib-panel.collapsed {
            padding-bottom: 0;
        }

        .calib-toggle-btn {
            background: none;
            border: none;
            color: #8e8e93;
            cursor: pointer;
            font-size: 14px;
            margin-left: auto;
            padding: 0 4px;
            line-height: 1;
            transition: color 0.2s, transform 0.2s;
        }

        .calib-toggle-btn:hover {
            color: #ffffff;
        }

        #calib-panel.collapsed .calib-toggle-btn {
            transform: rotate(180deg);
        }

        #calib-coords,
        #calib-rot {
            background: #000;
            padding: 8px;
            border-radius: 6px;
            font-family: monospace;
            font-size: 11px;
            text-align: center;
            color: #4ade80;
            user-select: all;
            margin-top: 5px;
        }
    </style>
</head>

<body>
    <!-- SIDEBAR PANEL -->
    <div id="checklist-panel">
        <div class="panel-header">
            <span class="panel-header-label" id="panel-header-label">Paso 1</span>
            <button class="close-btn" onclick="closeChecklist()">✕</button>
        </div>
        <div class="panel-step-block">
            <div class="panel-step-title">
                <span class="step-emoji" id="panel-step-emoji">📋</span>
                <span class="step-title-text" id="panel-title-text">Paso 1</span>
            </div>
            <div class="step-objective" id="panel-objective"></div>
        </div>
        <div class="checklist-items-wrap" id="checklist-items-container"></div>
        <div class="panel-footer">
            <div class="progress-label" id="progress-label">0 / 0 completados</div>
            <div class="progress-bar-wrap">
                <div class="progress-bar-fill" id="progress-bar" style="width:0%"></div>
            </div>
        </div>
    </div>


    <!-- BOTONES TOGGLE DE MODELOS -->
    <div id="sidebar-models">
        <button id="btn-electrico" class="model-toggle-btn" onclick="handleToggle('electrico')">
            <span class="fbx-dot"></span> ⚡ M. Eléctrico
        </button>
        <button id="btn-clima" class="model-toggle-btn" onclick="handleToggle('clima')">
            <span class="fbx-dot"></span> ❄️ M. Clima
        </button>

        <!-- SWEEP ID DISPLAY -->
        <div id="sweep-id-widget">
            <div id="sweep-id-label">📍 Sweep ID</div>
            <div id="sweep-id-display" onclick="copySweepId()" title="Click para copiar">
                <div id="sweep-id-dot"></div>
                <span id="sweep-id-value">esperando...</span>
                <span id="sweep-copy-icon">⎘</span>
            </div>
            <div id="sweep-copy-toast">¡Copiado!</div>
        </div>

        <!-- ROTATION DISPLAY -->
        <div id="rotation-widget">
            <div id="rotation-label">🎥 Rotación</div>
            <div id="rotation-display" onclick="copyRotation()" title="Click para copiar">
                <div id="rotation-dot"></div>
                <span id="rotation-value">esperando...</span>
                <span id="rotation-copy-icon">⎘</span>
            </div>
            <div id="rotation-copy-toast">¡Copiado!</div>
        </div>
    </div>



    <!-- PANEL DE CALIBRACIÓN BIM -->
    <div id="calib-panel">
        <div class="calib-header" id="calib-drag-handle">
            🛠️ Calibrador Avanzado
            <button class="calib-toggle-btn" id="calib-toggle" onclick="toggleCalibPanel()"
                title="Colapsar/Expandir">▲</button>
        </div>
        <div id="calib-panel-body" class="calib-body">

            <select id="calib-model-select" class="calib-select" onchange="updateCalibDisplay()">
            </select>

            <div class="calib-row" style="margin-top:5px">
                <span>Paso:</span>
                <input type="number" id="calib-step" class="calib-input" value="0.1" step="0.01">
            </div>

            <div style="font-size:11px;color:#aaa;text-align:center;margin-top:5px">POSICIÓN (M)</div>
            <div class="calib-row">
                <span>Eje X:</span>
                <div><button class="calib-btn" onclick="nudgePos('x',-1)">-</button><button class="calib-btn"
                        onclick="nudgePos('x',1)">+</button></div>
            </div>
            <div class="calib-row">
                <span>Eje Y:</span>
                <div><button class="calib-btn" onclick="nudgePos('y',-1)">-</button><button class="calib-btn"
                        onclick="nudgePos('y',1)">+</button></div>
            </div>
            <div class="calib-row">
                <span>Eje Z:</span>
                <div><button class="calib-btn" onclick="nudgePos('z',-1)">-</button><button class="calib-btn"
                        onclick="nudgePos('z',1)">+</button></div>
            </div>
            <div id="calib-coords">Pos: x: 0.00, y: 0.00, z: 0.00</div>

            <div style="font-size:11px;color:#aaa;text-align:center;margin-top:10px">ROTACIÓN (GRADOS)</div>
            <div class="calib-row">
                <span>Paso Rot:</span>
                <input type="number" id="calib-rot-step" class="calib-input" value="5" step="1">
            </div>
            <div class="calib-row">
                <span>Rot X:</span>
                <div><button class="calib-btn" onclick="nudgeRot('x',-1)">-</button><button class="calib-btn"
                        onclick="nudgeRot('x',1)">+</button></div>
            </div>
            <div class="calib-row">
                <span>Rot Y:</span>
                <div><button class="calib-btn" onclick="nudgeRot('y',-1)">-</button><button class="calib-btn"
                        onclick="nudgeRot('y',1)">+</button></div>
            </div>
            <div class="calib-row">
                <span>Rot Z:</span>
                <div><button class="calib-btn" onclick="nudgeRot('z',-1)">-</button><button class="calib-btn"
                        onclick="nudgeRot('z',1)">+</button></div>
            </div>
            <div id="calib-rot">Rot: x: 0°, y: 0°, z: 0°</div>
        </div><!-- /calib-panel-body -->
    </div>

    <iframe id="showcase" width="100%" height="100%"
        src="./bundle/showcase.html?m=hXEV8zd9GFy&play=1&qs=1&log=0&applicationKey=myhcpcdgdh7907ggei7s5f4md"
        frameborder="0" allowfullscreen allow="vr; xr-spatial-tracking"

            'cuboSdk': { id: 'cuboSdk', label: 'Cubo SDK', icon: '📦', file: 'cubosdk.glb', type: 'mp.gltfLoader', scale: 1.0, node: null, visible: true },

        };

        function syncToggleBtn(id) {
            const m = modelsData[id];
            const btn = document.getElementById('btn-' + id);
            if (!btn) return;
            if (m.visible) {
                btn.classList.remove('off');
            } else {
                btn.classList.add('off');
            }
        }

        // Toggle con actualización visual del botón
        function handleToggle(id) {
            const m = modelsData[id];
            if (!m) return;
            if (!m.node) {
                console.warn(`⚠️ [${id}] Modelo no cargado aún.`);
                return;
            }
            m.visible = !m.visible;
            m.node.obj3D.visible = m.visible;
            syncToggleBtn(id);
        }

        // ── CALIBRADOR: datos y funciones ──────────────────────────
        const tagsCalibData = {};

        function initModelUI() {
            const select = document.getElementById('calib-model-select');
            if (!select) return;
            select.innerHTML = '';

            const grpModels = document.createElement('optgroup');
            grpModels.label = '── Modelos 3D ──';
            select.appendChild(grpModels);
            Object.values(modelsData).forEach(m => {
                const opt = document.createElement('option');
                opt.value = m.id;
                opt.textContent = `${m.icon} ${m.label}`;
                grpModels.appendChild(opt);
            });

            const grpTags = document.createElement('optgroup');
            grpTags.label = '── Tags Checklist ──';
            grpTags.id = 'calib-tags-group';
            select.appendChild(grpTags);
        }

        function registerTagForCalib(stepId, sid, label, anchorPosition) {
            const key = `tag_${stepId}`;
            tagsCalibData[key] = { sid, anchorPosition: Object.assign({}, anchorPosition), stepLabel: label };
            const grp = document.getElementById('calib-tags-group');
            if (!grp) return;
            if (grp.querySelector(`option[value="${key}"]`)) return;
            const opt = document.createElement('option');
            opt.value = key;
            opt.textContent = `📍 Paso ${stepId}: ${label.replace(/^Paso \d+: /, '')}`;
            grp.appendChild(opt);
        }

        function getActiveModel() {
            const el = document.getElementById('calib-model-select');
            if (!el) return null;
            const id = el.value;
            if (id && id.startsWith('tag_')) return null;
            return modelsData[id] || null;
        }

        function getActiveTag() {
            const el = document.getElementById('calib-model-select');
            if (!el) return null;
            const id = el.value;
            if (!id || !id.startsWith('tag_')) return null;
            return tagsCalibData[id] || null;
        }

        function nudgePos(axis, dir) {
            const stepEl = document.getElementById('calib-step');
            const step = stepEl ? (parseFloat(stepEl.value) || 0.1) : 0.1;
            const tag = getActiveTag();
            if (tag) {
                tag.anchorPosition[axis] = (tag.anchorPosition[axis] || 0) + step * dir;
                if (mpSdk) mpSdk.Mattertag.editPosition(tag.sid, { anchorPosition: tag.anchorPosition, stemVector: { x: 0, y: 0, z: 0 } }).catch(e => console.warn('editPosition:', e));
                updateCalibDisplay(); return;
            }
            const m = getActiveModel();
            if (!m || !m.node) return;
            m.node.obj3D.position[axis] += step * dir;
            updateCalibDisplay();
        }

        function nudgeRot(axis, dir) {
            if (getActiveTag()) return;
            const m = getActiveModel();
            if (!m || !m.node) return;
            const stepEl = document.getElementById('calib-rot-step');
            const step = stepEl ? (parseFloat(stepEl.value) || 5) : 5;
            m.node.obj3D.rotation[axis] += step * dir * (Math.PI / 180);
            updateCalibDisplay();
        }

        function updateCalibDisplay() {
            const tag = getActiveTag();
            if (tag) {
                const p = tag.anchorPosition;
                const coordEl = document.getElementById('calib-coords');
                const rotEl = document.getElementById('calib-rot');
                if (coordEl) coordEl.innerText = `Pos: x: ${(p.x || 0).toFixed(3)}, y: ${(p.y || 0).toFixed(3)}, z: ${(p.z || 0).toFixed(3)}`;
                if (rotEl) rotEl.innerText = `(Tags no tienen rotación)`;
                return;
            }
            const m = getActiveModel();
            if (!m || !m.node) return;
            const p = m.node.obj3D.position;
            const r = m.node.obj3D.rotation;
            const coordEl = document.getElementById('calib-coords');
            const rotEl = document.getElementById('calib-rot');
            if (coordEl) coordEl.innerText = `Pos: x: ${p.x.toFixed(3)}, y: ${p.y.toFixed(3)}, z: ${p.z.toFixed(3)}`;
            if (rotEl) rotEl.innerText = `Rot: x: ${(r.x * 180 / Math.PI).toFixed(0)}°, y: ${(r.y * 180 / Math.PI).toFixed(0)}°, z: ${(r.z * 180 / Math.PI).toFixed(0)}°`;
        }

        // ── COLAPSO/EXPANSIÓN ──────────────────────────────────────
        function toggleCalibPanel() {
            document.getElementById('calib-panel').classList.toggle('collapsed');
        }

        // ── DRAG & DROP ───────────────────────────────────────────
        (function () {
            const panel = document.getElementById('calib-panel');
            const handle = document.getElementById('calib-drag-handle');
            if (!panel || !handle) return;
            let dragging = false, startX = 0, startY = 0, origLeft = 0, origTop = 0;
            handle.addEventListener('mousedown', (e) => {
                if (e.target.id === 'calib-toggle') return; // no arrastrar al pulsar el botón
                dragging = true;
                startX = e.clientX; startY = e.clientY;
                const rect = panel.getBoundingClientRect();
                origLeft = rect.left; origTop = rect.top;
                panel.style.transition = 'none';
                e.preventDefault();
            });
            document.addEventListener('mousemove', (e) => {
                if (!dragging) return;
                const newLeft = Math.max(0, Math.min(window.innerWidth - panel.offsetWidth, origLeft + e.clientX - startX));
                const newTop = Math.max(0, Math.min(window.innerHeight - panel.offsetHeight, origTop + e.clientY - startY));
                panel.style.left = newLeft + 'px';
                panel.style.top = newTop + 'px';
                panel.style.right = 'auto';
            });
            document.addEventListener('mouseup', () => { dragging = false; });
        })();

        // Inicializar select del calibrador
        initModelUI();


        // Step emojis by step id
        const stepEmojis = { 1: '📋', 2: '⚡', 3: '🔌', 4: '🔒', 5: '🏷️' };

        // =====================================================
        // DEFINICIÓN DE LOS PASOS DEL CHECKLIST
        // =====================================================
        // =====================================================
        // DEFINICIÓN DE LOS PASOS DEL CHECKLIST
        // ──────────────────────────────────────────────────────
        // INSTRUCCIÓN PARA CALIBRAR sweep_id:
        //   Abre la consola del navegador y navega manualmente
        //   por el modelo. El logger de sweeps (al final del script)
        //   imprimirá cada sweep_id al que llegues.
        //   Copia esos IDs y reemplaza los valores de abajo.
        // =====================================================
        const checklistSteps = [
            {
                id: 1,
                label: "Paso 1: Notificación y Autorización",
                objective: "Asegurar que el área sabe que el equipo se va a detener.",
                anchorPosition: { x: -15.6, y: 1.2, z: -2.7 },

                color: { r: 0.42, g: 0.27, b: 0.97 },
                iconId: 'public_characters_1',
                coordinates: {
                    sweep_id: 'c06e7c7685684ab1af6d33371ac893fc',  // ← reemplazar con ID real de consola
                    rotation: { x: -9.7, y: -21.1 }   // pitch / yaw en grados
                },
                items: [
                    { text: "<strong>Identificar equipo:</strong> Confirmar visualmente el equipo a intervenir (ej. Molino SAC 3)." },
                    { text: "<strong>Tomar equipo de comunicación:</strong> Interactuar con la radio en la mesa de inicio." },
                    { text: "<strong>Contactar al encargado:</strong> Solicitar por radio la detención operativa del equipo." },
                    { text: "<strong>Recibir autorización:</strong> Escuchar la confirmación de detención por parte del jefe de turno antes de avanzar." }
                ]
            },
            {
                id: 2,

                objective: "Encontrar el punto exacto donde se debe cortar la energía.",

                stemVector: { x: 0, y: 0, z: 0 },
                color: { r: 0.97, g: 0.55, b: 0.10 },
                iconId: 'public_characters_2',
                coordinates: {
                    sweep_id: '89a800e3dbac4487b6fa87fe1908a2a3',
                    rotation: { x: -27.1, y: -52.8 }
                },
                items: [
                    { text: "<strong>Navegar a la sala eléctrica:</strong> Dirigirse al área de tableros." },
                    { text: "<strong>Localizar tablero general:</strong> Identificar el panel principal que alimenta el equipo." },
                    { text: "<strong>Ubicar el interruptor específico:</strong> Leer las etiquetas del tablero para encontrar la palanca exacta que corresponde al equipo a intervenir." }
                ]
            },
            {
                id: 3,
                label: "Paso 3: Aislamiento",
                objective: "Cortar físicamente el flujo de energía.",
                anchorPosition: { x: -18.5, y: 1.4, z: -2.2 },
                stemVector: { x: 0, y: 0, z: 0 },
                color: { r: 0.14, g: 0.78, b: 0.55 },
                iconId: 'public_characters_3',
                coordinates: {
                    sweep_id: '89a800e3dbac4487b6fa87fe1908a2a3',

                },

                },

                    { text: "<strong>Ir a la estación de bloqueo:</strong> Desplazarse hacia la caja de seguridad amarilla (<em>SafeLockout</em>)." },

                coordinates: {
                    sweep_id: '89a800e3dbac4487b6fa87fe1908a2a3',
                    rotation: { x: -14.2, y: -51.5 }
                },
                items: [
                    { text: "<strong>Regresar al punto de corte:</strong> Volver al tablero aislado en el Paso 3." },
                    { text: "<strong>Instalar pinza:</strong> Colocar la pinza en los orificios de bloqueo de la palanca." },
                    { text: "<strong>Instalar candado:</strong> Insertar el candado cerrando la pinza." },
                    { text: "<strong>Instalar tarjeta:</strong> Enganchar la tarjeta de advertencia de \"PELIGRO\" junto al candado." }
                ]
            }
        ];

        // Estado de los checkboxes: stepId -> array de booleans
        const checkState = {};
        checklistSteps.forEach(step => {
            checkState[step.id] = step.items.map(() => false);
        });

        // ── ÍNDICE SECUENCIAL ──────────────────────────────────
        let currentStepIndex = 0;   // índice en checklistSteps[]
        let isAdvancing = false;    // bloqueo durante la transición

        // =====================================================
        // FUNCIONES DEL PANEL
        // =====================================================

        // =====================================================
        // FUNCIÓN CENTRAL DE MOVIMIENTO — desacoplada (fire-and-forget)
        // El UI avanza SIEMPRE en 800ms. La cámara se mueve en segundo plano.
        // =====================================================

        // Mapa inverso: stepId → sid del Mattertag generado
        // Se puebla dentro del loop de sdk.Mattertag.add (más abajo)
        const stepSidMap = {};

        function navigateToStep(index) {
            if (index < 0 || index >= checklistSteps.length) {
                isAdvancing = false;
                return;
            }

            const step = checklistSteps[index];
            const tagSid = stepSidMap[step.id];
            const sweepId = step.coordinates && step.coordinates.sweep_id;
            const hasRealSweep = sweepId && !sweepId.startsWith('SWEEP_ID_PASO');

            console.log(`🚀 [Paso ${step.id}] hasRealSweep:${hasRealSweep} | sweep:${sweepId} | tag:${tagSid}`);

            if (!mpSdk) {
                console.warn('⚠️ SDK no disponible.');
                renderChecklistUI(index);
                isAdvancing = false;
                return;
            }

            let resolved = false;

            // SEGURO DE VIDA: Si el motor no responde en 4s, fuerza el avance
            const failSafeTimer = setTimeout(() => {
                if (!resolved) {
                    console.warn(`⏳ [Paso ${step.id}] Timeout 4s → forzando UI.`);
                    resolved = true;
                    renderChecklistUI(index);
                    isAdvancing = false;
                }
            }, 4000);

            const afterFlight = () => {
                if (!resolved) {
                    resolved = true;
                    clearTimeout(failSafeTimer);
                    console.log(`🏁 [Paso ${step.id}] afterFlight ejecutado.`);
                    renderChecklistUI(index);
                    isAdvancing = false;
                }
            };

            // ── ESTRATEGIA 1: Sweep.moveTo (más confiable, no depende de tags) ──
            if (hasRealSweep) {
                const rot = (step.coordinates.rotation) || { x: 0, y: 0 };
                console.log(`📍 Sweep.moveTo → "${sweepId}" rot x:${rot.x} y:${rot.y}`);
                mpSdk.Sweep.moveTo(sweepId.trim(), { rotation: { x: rot.x, y: rot.y } })
                    .then(() => console.log(`✅ [Paso ${step.id}] Sweep.moveTo OK`))
                    .catch(err => console.error(`❌ [Paso ${step.id}] Sweep.moveTo falló:`, err))
                    .finally(afterFlight);
                return;
            }

            // ── ESTRATEGIA 2: Mattertag.navigateTo (para pasos sin sweep calibrado) ──
            if (tagSid) {
                console.log(`🎯 navigateTo → tag sid: ${tagSid}`);
                mpSdk.Mattertag.navigateTo(tagSid)
                    .then(() => console.log(`✅ [Paso ${step.id}] navigateTo OK`))
                    .catch(err => console.error(`❌ [Paso ${step.id}] navigateTo falló:`, err))
                    .finally(afterFlight);
                return;
            }

            // ── Sin sweep ni tag: solo actualizar UI ──
            console.warn(`⚠️ [Paso ${step.id}] Sin sweep ni tag. Actualizando solo UI.`);
            afterFlight();
        }



        // =====================================================
        // RENDERIZADO DE UI (solo panel, sin tocar la cámara)
        // =====================================================
        function renderChecklistUI(index) {
            if (index < 0 || index >= checklistSteps.length) return;
            currentStepIndex = index;
            const step = checklistSteps[index];

            document.getElementById('panel-header-label').textContent = `Paso ${step.id} de ${checklistSteps.length}`;
            document.getElementById('panel-step-emoji').textContent = stepEmojis[step.id] || '📋';
            document.getElementById('panel-title-text').textContent = step.label;
            document.getElementById('panel-objective').textContent = step.objective;

            renderItems(step);
            updateProgress(step);
            document.getElementById('checklist-panel').classList.add('visible');

            // ── VISIBILIDAD DE MODELOS POR PASO ──
            setStepModels(index);

            isAdvancing = false;  // liberar bloqueo una vez que el UI está listo
        }

        /**
         * Muestra/oculta los modelos asociados a cada paso.
         * @param {number} activeIndex  índice activo en checklistSteps (-1 = ocultar todo)
         * @param {boolean} forceHide   si true, oculta los modelos del activeIndex también
         */
        function setStepModels(activeIndex, forceHide = false) {
            // Mapa: id de paso → IDs de modelos que aparecen en ese paso
            const stepModels = {
                1: ['radio'],
                4: ['candado', 'etiqueta', 'pinzas'],
                5: ['lotoPinza', 'lotoCandado', 'lotoEtiqueta']
            };

            // Reglas condicionales: el modelo SOLO se muestra si se cumple su condición en el checklist
            const conditionalModels = {
                'pinzas': (step) => checkState[step] && checkState[step][1],
                'candado': (step) => checkState[step] && checkState[step][2],
                'etiqueta': (step) => checkState[step] && checkState[step][3],
                'lotoPinza': (step) => checkState[step] && checkState[step][1],
                'lotoCandado': (step) => checkState[step] && checkState[step][2],
                'lotoEtiqueta': (step) => checkState[step] && checkState[step][3],
            };

            const activeStep = checklistSteps[activeIndex];
            const activeStepId = activeStep ? activeStep.id : -1;

            Object.entries(stepModels).forEach(([stepIdStr, modelIds]) => {
                const stepId = parseInt(stepIdStr);
                const isCurrentStep = !forceHide && (stepId === activeStepId);

                modelIds.forEach(mid => {
                    const m = modelsData[mid];
                    if (!m || !m.node) return;

                    let shouldShow = isCurrentStep;

                    // Si estamos en el paso y tiene regla, suplantar por la regla
                    if (isCurrentStep && conditionalModels[mid]) {
                        shouldShow = conditionalModels[mid](stepId);
                    }

                    // Para modelos FBX grandes (Radio), el obj3D existe pero sus hijos
                    // pueden tardar en cargarse. Usamos polling hasta que esté listo.
                    const applyVisibility = (attempts = 0) => {
                        const obj = m.node.obj3D;
                        const isReady = obj && (obj.children.length > 0 || attempts > 40);
                        if (!isReady) {
                            setTimeout(() => applyVisibility(attempts + 1), 250);
                            return;
                        }
                        obj.visible = shouldShow;
                        m.visible = shouldShow;
                        // console.log(`👁️ [${mid}] visible=${shouldShow} (intentos: ${attempts})`);
                    };
                    applyVisibility();
                });
            });
        }

        // Alias principal (usado desde tag click y auto-avance)
        function renderCurrentStep(index) {
            navigateToStep(index);
        }

        /**
         * Abrir por stepId cuando el usuario hace click en un Mattertag.
         * El usuario YA está en la posición del tag → solo actualizar UI, NO navegar.
         */
        function openChecklist(stepId) {
            const index = checklistSteps.findIndex(s => s.id === stepId);
            if (index !== -1) renderChecklistUI(index);
        }

        function renderItems(step) {
            const container = document.getElementById('checklist-items-container');
            container.innerHTML = '';

            step.items.forEach((item, idx) => {
                const checked = checkState[step.id][idx];
                const div = document.createElement('div');
                div.className = 'checklist-item' + (checked ? ' checked' : '');
                div.innerHTML = `
                    <div class="check-box">
                        <span class="check-icon">✓</span>
                    </div>
                    <div class="item-text">${item.text}</div>
                `;
                div.onclick = () => toggleItem(step.id, idx);
                container.appendChild(div);
            });

            const allChecked = checkState[step.id].every(Boolean);
            if (allChecked) {
                const btn = document.createElement('button');
                btn.className = 'next-step-btn';
                const nextIndex = currentStepIndex + 1;

                if (nextIndex < checklistSteps.length) {
                    btn.textContent = `Ir al Paso ${checklistSteps[nextIndex].id} ➔`;
                    btn.onclick = () => {
                        if (isAdvancing) return;
                        isAdvancing = true;
                        btn.textContent = 'Navegando...';
                        btn.style.opacity = '0.7';
                        setStepModels(-1, true);
                        navigateToStep(nextIndex);
                    };
                } else {
                    btn.textContent = 'Finalizar Capacitación ✅';
                    btn.onclick = () => showAllDone();
                }
                container.appendChild(btn);
            }
        }

        function toggleItem(stepId, idx) {
            if (isAdvancing) return;
            checkState[stepId][idx] = !checkState[stepId][idx];

            const total = step.items.length;

            const pct = total > 0 ? Math.round((done / total) * 100) : 0;
            document.getElementById('progress-label').textContent = `${done} / ${total} completados`;
            document.getElementById('progress-bar').style.width = pct + '%';

            console.log('Hello Bundle SDK', sdk);

            // THREE y GLTFLoader vienen del CDN vía import map,
            // completamente independientes del bundle interno de Matterport.
            const [THREE, { GLTFLoader }] = await Promise.all([_threePromise, _gltfLoaderPromise]);
            console.log('⚙️ [ESM] THREE r' + THREE.REVISION + ' y GLTFLoader listos.');

            sdk.Scene.register('custom.animatedGltf', function () {
                let mixer = null;
                // THREE interno de Matterport para materiales compatibles con su renderer
                const mpTHREE = showcase.contentWindow.THREE;

                return {
                    inputs: {
                        url: '',
                        localPosition: { x: 0, y: 0, z: 0 },
                        localRotation: { x: 0, y: 0, z: 0 },
                        localScale: { x: 1, y: 1, z: 1 }
                    },

                    // El SDK necesita objectRoot como Object3D válido desde el inicio
                    outputs: {
                        objectRoot: null
                    },

                    onInit() {
                        const { url, localPosition, localRotation, localScale } = this.inputs;
                        const loader = new GLTFLoader();
                        const self = this;

                        // ① Inicializar objectRoot ANTES del fetch para que el SDK
                        //    siempre tenga un Object3D válido (evita "Cannot read .add of undefined")
                        self.outputs.objectRoot = new THREE.Group();
                        self.outputs.objectRoot.position.set(localPosition.x, localPosition.y, localPosition.z);
                        self.outputs.objectRoot.rotation.set(
                            THREE.MathUtils.degToRad(localRotation.x),
                            THREE.MathUtils.degToRad(localRotation.y),
                            THREE.MathUtils.degToRad(localRotation.z)
                        );
                        self.outputs.objectRoot.scale.set(localScale.x, localScale.y, localScale.z);

                        console.log(`🔄 [AnimGLTF] Cargando via fetch: ${url}`);

                        // ② fetch + parseAsync evita que GLTFLoader resuelva blob: URLs de texturas
                        fetch(url)
                            .then(res => {
                                if (!res.ok) throw new Error(`HTTP ${res.status}: ${url}`);
                                return res.arrayBuffer();
                            })
                            .then(buffer => loader.parseAsync(buffer, ''))
                            .then(gltf => {
                                const model = gltf.scene;
                                console.log(`✅ [AnimGLTF] Parseado: ${url} — ${model.children.length} hijos.`);

                                // Material compatible con el renderer interno de Matterport
                                if (mpTHREE && mpTHREE.MeshStandardMaterial) {
                                    const safeMat = new mpTHREE.MeshStandardMaterial({
                                        color: 0x888888, roughness: 0.6, metalness: 0.2,
                                        side: mpTHREE.DoubleSide
                                    });
                                    model.traverse(child => {
                                        if (child.isMesh) child.material = safeMat;
                                    });
                                    console.log(`🎨 [AnimGLTF] Material aplicado.`);
                                }

                                // ③ Agregar al grupo ya registrado como objectRoot
                                self.outputs.objectRoot.add(model);
                                console.log(`🔗 [AnimGLTF] Añadido a objectRoot. Children: ${self.outputs.objectRoot.children.length}`);

                                // ④ Animaciones en loop — lógica intacta para LOTO
                                if (gltf.animations && gltf.animations.length > 0) {
                                    mixer = new THREE.AnimationMixer(model);
                                    gltf.animations.forEach(clip => {
                                        mixer.clipAction(clip).setLoop(THREE.LoopRepeat, Infinity).play();
                                    });
                                    console.log(`⚙️ [AnimGLTF] ${gltf.animations.length} animación(es) en loop.`);
                                } else {
                                    console.warn(`⚠️ [AnimGLTF] ${url} sin animaciones (mesh estático).`);
                                }
                            })
                            .catch(err => console.error(`❌ [AnimGLTF] Error cargando ${url}:`, err));
                    },

                    onTick(delta) {
                        if (mixer) mixer.update(delta / 1000);
                    },

                    onDestroy() {
                        if (mixer) { mixer.stopAllAction(); mixer = null; }
                    }
                };
            });

            // =====================================================
            // HELPERS: crear ícono numerado con canvas
            // =====================================================
            function makeNumberIcon(number, color) {
                const canvas = document.createElement('canvas');
                canvas.width = 128;
                canvas.height = 128;
                const ctx = canvas.getContext('2d');
                const cx = 64, cy = 64, r = 56;

                // Círculo de fondo con el color del paso
                const cr = Math.round(color.r * 255);
                const cg = Math.round(color.g * 255);
                const cb = Math.round(color.b * 255);
                ctx.beginPath();
                ctx.arc(cx, cy, r, 0, Math.PI * 2);
                ctx.fillStyle = `rgb(${cr}, ${cg}, ${cb})`;
                ctx.fill();

                // Borde blanco
                ctx.strokeStyle = 'rgba(255,255,255,0.9)';
                ctx.lineWidth = 6;
                ctx.stroke();

                // Número en blanco, centrado
                ctx.fillStyle = '#ffffff';
                ctx.font = 'bold 64px Arial, sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(number.toString(), cx, cy + 2);

                return canvas.toDataURL('image/png');
            }

            // =====================================================
            // AGREGAR TAGS DEL CHECKLIST CON sdk.Mattertag.add
            // =====================================================
            // ── CREAR MATTERTAGS DEL CHECKLIST ──────────────────────

            for (const step of checklistSteps) {
                try {
                    // 1. Intentar registrar ícono personalizado (FAIL-SAFE: no impide crear el tag)
                    const customIconId = `paso_num_${step.id}`;
                    let iconRegistered = false;
                    try {
                        const iconDataUrl = makeNumberIcon(step.id, step.color);
                        await sdk.Mattertag.registerIcon(customIconId, iconDataUrl);
                        iconRegistered = true;
                    } catch (iconErr) {
                        console.warn(`⚠️ [Paso ${step.id}] registerIcon falló (usando ícono integrado): ${iconErr.message || iconErr}`);
                    }

                    // 2. Crear el Mattertag (SIEMPRE se ejecuta, independiente del ícono)
                    const [sid] = await sdk.Mattertag.add({
                        label: step.label,
                        description: step.objective || '',
                        anchorPosition: step.anchorPosition,
                        stemVector: step.stemVector,
                        color: step.color
                    });

                    // 3. Poblar ambos mapas
                    tagSidMap[sid] = step.id;   // sid → stepId  (click handler)
                    stepSidMap[step.id] = sid;  // stepId → sid  (navigateToStep)

                    // 4. Aplicar ícono: primero el custom, si falla usar el integrado (public_characters_X)
                    try {
                        if (iconRegistered) {
                            await sdk.Mattertag.editIcon(sid, customIconId);
                        } else {
                            await sdk.Mattertag.editIcon(sid, step.iconId);
                        }
                    } catch (e) {
                        console.warn(`⚠️ [Paso ${step.id}] editIcon falló:`, e.message || e);
                    }

                    // 5. Registrar en el calibrador
                    registerTagForCalib(step.id, sid, step.label, step.anchorPosition);

                    console.log(`✅ Tag creado: "${step.label}" | sid: ${sid}`);
                } catch (e) {

            });

                    const el = document.getElementById('rotation-value');

        // ── Copiar sweep_id al portapapeles ─────────────────────────
        function copySweepId() {
            const sid = document.getElementById('sweep-id-value').textContent;
            if (!sid || sid === 'esperando...') return;
            navigator.clipboard.writeText(sid).then(() => {
                const toast = document.getElementById('sweep-copy-toast');
                toast.classList.add('show');
                setTimeout(() => toast.classList.remove('show'), 1800);
            }).catch(() => {
                // Fallback para contextos sin HTTPS
                const ta = document.createElement('textarea');
                ta.value = sid;
                document.body.appendChild(ta);
                ta.select();
                document.execCommand('copy');
                document.body.removeChild(ta);
                const toast = document.getElementById('sweep-copy-toast');
                toast.classList.add('show');
                setTimeout(() => toast.classList.remove('show'), 1800);
            });
        }

        // ── Copiar rotación al portapapeles ─────────────────────────
        function copyRotation() {
            const val = document.getElementById('rotation-value').textContent;
            if (!val || val === 'esperando...') return;
            // Formatear como objeto JS listo para pegar en el código
            const match = val.match(/x:\s*([\d.\-]+)\s+y:\s*([\d.\-]+)/);
            const text = match
                ? `rotation: { x: ${match[1]}, y: ${match[2]} }`
                : val;
            const copy = (t) => {
                navigator.clipboard.writeText(t).catch(() => {
                    const ta = document.createElement('textarea');
                    ta.value = t;
                    document.body.appendChild(ta);
                    ta.select();
                    document.execCommand('copy');
                    document.body.removeChild(ta);
                });
                const toast = document.getElementById('rotation-copy-toast');
                toast.classList.add('show');
                setTimeout(() => toast.classList.remove('show'), 1800);
            };
            copy(text);
        }
