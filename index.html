<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="viewport"
        content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0, shrink-to-fit=no">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>BIM+NP</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            width: 100%;
            height: 100vh;
            overflow: hidden;
            font-family: 'Inter', 'Segoe UI', sans-serif;
        }

        /* ── SIDEBAR PANEL ── */
        #checklist-panel {
            display: none;
            position: fixed;
            top: 0;
            right: 0;
            width: 300px;
            height: 100vh;
            background: #1c1c1e;
            z-index: 99999;
            pointer-events: auto;
            flex-direction: column;
            overflow: hidden;
        }

        #checklist-panel.visible {
            display: flex;
        }

        /* Header */
        .panel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 18px 20px 14px 20px;
            border-bottom: 1px solid #2c2c2e;
            flex-shrink: 0;
        }

        .panel-header-label {
            font-size: 13px;
            font-weight: 600;
            color: #ffffff;
            letter-spacing: 0.2px;
        }

        .close-btn {
            background: none;
            border: none;
            color: #8e8e93;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: color 0.2s, background 0.2s;
        }

        .close-btn:hover {
            background: #2c2c2e;
            color: #ffffff;
        }

        /* Step title */
        .panel-step-block {
            padding: 16px 20px 12px 20px;
            border-bottom: 1px solid #2c2c2e;
            flex-shrink: 0;
        }

        .panel-step-title {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 8px;
        }

        .step-emoji {
            font-size: 18px;
            line-height: 1;
        }

        .step-title-text {
            font-size: 15px;
            font-weight: 700;
            color: #ffffff;
            line-height: 1.3;
        }

        .step-objective {
            font-size: 12px;
            color: #8e8e93;
            line-height: 1.5;
            padding-left: 2px;
        }

        /* Items container */
        .checklist-items-wrap {
            flex: 1;
            overflow-y: auto;
            padding: 12px 20px 20px;
            scrollbar-width: thin;
            scrollbar-color: #3a3a3c #1c1c1e;
        }

        .checklist-items-wrap::-webkit-scrollbar {
            width: 4px;
        }

        .checklist-items-wrap::-webkit-scrollbar-track {
            background: #1c1c1e;
        }

        .checklist-items-wrap::-webkit-scrollbar-thumb {
            background: #3a3a3c;
            border-radius: 2px;
        }

        /* Individual item */
        .checklist-item {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            padding: 10px 0;
            cursor: pointer;
            border-bottom: 1px solid #2c2c2e;
            transition: opacity 0.2s;
        }

        .checklist-item:last-child {
            border-bottom: none;
        }

        .checklist-item:hover {
            opacity: 0.85;
        }

        .check-box {
            width: 16px;
            height: 16px;
            min-width: 16px;
            border: 1.5px solid #636366;
            border-radius: 3px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-top: 2px;
            transition: all 0.2s;
            background: transparent;
        }

        .checklist-item.checked .check-box {
            background: #22c55e;
            border-color: #22c55e;
        }

        .check-icon {
            display: none;
            color: white;
            font-size: 10px;
            font-weight: 800;
        }

        .checklist-item.checked .check-icon {
            display: block;
        }

        .item-text {
            font-size: 13px;
            line-height: 1.5;
            color: #d1d1d6;
        }

        .checklist-item.checked .item-text {
            color: #636366;
            text-decoration: line-through;
        }

        .item-text strong {
            color: #ffffff;
            font-weight: 600;
        }

        .checklist-item.checked .item-text strong {
            color: #636366;
        }

        /* Progress footer */
        .panel-footer {
            padding: 14px 20px;
            border-top: 1px solid #2c2c2e;
            flex-shrink: 0;
        }

        .progress-label {
            font-size: 11px;
            color: #8e8e93;
            margin-bottom: 6px;
        }

        .progress-bar-wrap {
            height: 4px;
            background: #3a3a3c;
            border-radius: 2px;
            overflow: hidden;
        }

        .progress-bar-fill {
            height: 100%;
            background: #22c55e;
            border-radius: 2px;
            transition: width 0.4s ease;
        }

        /* ── NUMBERED ICONS on the map ── */
        .mp-tag-number {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            font-weight: 700;
            color: #fff;
            border: 2px solid rgba(255, 255, 255, 0.8);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.5);
        }

        /* ── BOTONES DE MODELOS BIM ── */
        .model-toggle-btn {
            z-index: 9999;
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 16px;
            background: rgba(28, 28, 30, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 20px;
            cursor: pointer;
            font-family: 'Inter', sans-serif;
            font-size: 13px;
            font-weight: 600;
            color: #ffffff;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
            transition: all 0.25s ease;
            user-select: none;
        }

        .model-toggle-btn:hover {
            background: rgba(44, 44, 46, 0.95);
            border-color: rgba(255, 255, 255, 0.25);
            transform: translateY(-1px);
        }

        .fbx-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #22c55e;
            box-shadow: 0 0 6px #22c55e;
            transition: all 0.3s ease;
            flex-shrink: 0;
        }

        .model-toggle-btn.off .fbx-dot {
            background: #636366;
            box-shadow: none;
        }

        .model-toggle-btn.off {
            opacity: 0.7;
        }

        /* Botones laterales generados dinámicamente */
        #sidebar-models {
            position: fixed;
            left: 24px;
            top: 80px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            z-index: 9999;
        }

        /* ── NEXT STEP BUTTON ── */
        .next-step-btn {
            background-color: #22c55e;
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 14px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            transition: background 0.3s;
            margin-top: 16px;
        }

        .next-step-btn:hover {
            background-color: #16a34a;
        }

        /* ── ADVANCE TRAINING BUTTON ── */
        #advance-training-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            margin-top: 16px;
            padding: 12px 16px;
            background: linear-gradient(135deg, #22c55e 0%, #16a34a 100%);
            border: none;
            border-radius: 12px;
            cursor: pointer;
            font-family: 'Inter', 'Segoe UI', sans-serif;
            font-size: 14px;
            font-weight: 700;
            color: #ffffff;
            letter-spacing: 0.2px;
            box-shadow: 0 4px 16px rgba(34, 197, 94, 0.35);
            transition: all 0.25s ease;
            user-select: none;
        }

        #advance-training-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(34, 197, 94, 0.5);
            background: linear-gradient(135deg, #4ade80 0%, #22c55e 100%);
        }

        #advance-training-btn:active {
            transform: translateY(0);
            box-shadow: 0 2px 8px rgba(34, 197, 94, 0.3);
        }

        #advance-training-btn.finalizar {
            background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
            box-shadow: 0 4px 16px rgba(245, 158, 11, 0.35);
        }

        #advance-training-btn.finalizar:hover {
            background: linear-gradient(135deg, #fbbf24 0%, #f59e0b 100%);
            box-shadow: 0 6px 20px rgba(245, 158, 11, 0.5);
        }

        #advance-training-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        /* ── PANEL DE CALIBRACIÓN BIM (Draggable) ── */
        #calib-panel {
            position: fixed;
            top: 20px;
            left: calc(100vw - 300px);
            /* posición inicial cerca de la derecha */
            z-index: 9999;
            background: rgba(28, 28, 30, 0.92);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 12px;
            padding: 0 0 15px 0;
            color: white;
            font-family: 'Inter', sans-serif;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6);
            display: flex;
            flex-direction: column;
            gap: 0;
            min-width: 250px;
            user-select: none;
        }

        .calib-header {
            font-size: 13px;
            font-weight: 700;
            text-align: center;
            border-bottom: 1px solid #444;
            padding: 12px 16px;
            cursor: grab;
            background: rgba(255, 255, 255, 0.04);
            border-radius: 12px 12px 0 0;
            letter-spacing: 0.3px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .calib-header:active {
            cursor: grabbing;
        }

        .calib-header::before {
            content: '⠿';
            font-size: 16px;
            opacity: 0.4;
        }

        .calib-body {
            padding: 12px 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .calib-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            font-size: 13px;
        }

        .calib-btn {
            background: #3a3a3c;
            border: 1px solid #636366;
            color: white;
            border-radius: 4px;
            width: 30px;
            height: 30px;
            cursor: pointer;
            font-weight: bold;
        }

        .calib-btn:hover {
            background: #22c55e;
            border-color: #22c55e;
            color: black;
        }

        .calib-input {
            background: #1c1c1e;
            color: white;
            border: 1px solid #636366;
            border-radius: 4px;
            padding: 4px;
            width: 60px;
            text-align: center;
            font-size: 12px;
        }

        .calib-select {
            background: #1c1c1e;
            color: white;
            border: 1px solid #636366;
            border-radius: 4px;
            padding: 4px;
            font-size: 12px;
            width: 100%;
        }

        #calib-coords,
        #calib-rot {
            background: #000;
            padding: 8px;
            border-radius: 6px;
            font-family: monospace;
            font-size: 11px;
            text-align: center;
            color: #4ade80;
            user-select: all;
            margin-top: 5px;
        }
    </style>
</head>

<body>
    <!-- SIDEBAR PANEL -->
    <div id="checklist-panel">
        <div class="panel-header">
            <span class="panel-header-label" id="panel-header-label">Paso 1</span>
            <button class="close-btn" onclick="closeChecklist()">✕</button>
        </div>
        <div class="panel-step-block">
            <div class="panel-step-title">
                <span class="step-emoji" id="panel-step-emoji">📋</span>
                <span class="step-title-text" id="panel-title-text">Paso 1</span>
            </div>
            <div class="step-objective" id="panel-objective"></div>
        </div>
        <div class="checklist-items-wrap" id="checklist-items-container"></div>
        <div class="panel-footer">
            <div class="progress-label" id="progress-label">0 / 0 completados</div>
            <div class="progress-bar-wrap">
                <div class="progress-bar-fill" id="progress-bar" style="width:0%"></div>
            </div>
        </div>
    </div>


    <!-- BOTONES TOGGLE DE MODELOS -->
    <div id="sidebar-models">
        <button id="btn-electrico" class="model-toggle-btn" onclick="handleToggle('electrico')">
            <span class="fbx-dot"></span> ⚡ M. Eléctrico
        </button>
        <button id="btn-clima" class="model-toggle-btn" onclick="handleToggle('clima')">
            <span class="fbx-dot"></span> ❄️ M. Clima
        </button>
        <button id="btn-cubo" class="model-toggle-btn" onclick="handleToggle('cubo')">
            <span class="fbx-dot"></span> 📦 Cubo
        </button>
    </div>

    <!-- PANEL DE CALIBRACIÓN BIM -->
    <div id="calib-panel">
        <div class="calib-header" id="calib-drag-handle">🛠️ Calibrador Avanzado</div>
        <div class="calib-body">

            <select id="calib-model-select" class="calib-select" onchange="updateCalibDisplay()">
            </select>

            <div class="calib-row" style="margin-top: 5px;">
                <span>Paso:</span>
                <input type="number" id="calib-step" class="calib-input" value="0.1" step="0.01">
            </div>

            <div style="font-size: 11px; color:#aaa; text-align:center; margin-top:5px;">POSICIÓN (M)</div>
            <div class="calib-row">
                <span>Eje X:</span>
                <div><button class="calib-btn" onclick="nudgePos('x', -1)">-</button><button class="calib-btn"
                        onclick="nudgePos('x', 1)">+</button></div>
            </div>
            <div class="calib-row">
                <span>Eje Y:</span>
                <div><button class="calib-btn" onclick="nudgePos('y', -1)">-</button><button class="calib-btn"
                        onclick="nudgePos('y', 1)">+</button></div>
            </div>
            <div class="calib-row">
                <span>Eje Z:</span>
                <div><button class="calib-btn" onclick="nudgePos('z', -1)">-</button><button class="calib-btn"
                        onclick="nudgePos('z', 1)">+</button></div>
            </div>
            <div id="calib-coords">Pos: x: 0.00, y: 0.00, z: 0.00</div>

            <div style="font-size: 11px; color:#aaa; text-align:center; margin-top:10px;">ROTACIÓN (GRADOS)</div>
            <div class="calib-row">
                <span>Paso Rot:</span>
                <input type="number" id="calib-rot-step" class="calib-input" value="5" step="1">
            </div>
            <div class="calib-row">
                <span>Rot X:</span>
                <div><button class="calib-btn" onclick="nudgeRot('x', -1)">-</button><button class="calib-btn"
                        onclick="nudgeRot('x', 1)">+</button></div>
            </div>
            <div class="calib-row">
                <span>Rot Y:</span>
                <div><button class="calib-btn" onclick="nudgeRot('y', -1)">-</button><button class="calib-btn"
                        onclick="nudgeRot('y', 1)">+</button></div>
            </div>
            <div class="calib-row">
                <span>Rot Z:</span>
                <div><button class="calib-btn" onclick="nudgeRot('z', -1)">-</button><button class="calib-btn"
                        onclick="nudgeRot('z', 1)">+</button></div>
            </div>
            <div id="calib-rot">Rot: x: 0°, y: 0°, z: 0°</div>
        </div><!-- /calib-body -->
    </div>

    <iframe id="showcase" width="100%" height="100%"
        src="./bundle/showcase.html?m=hXEV8zd9GFy&play=1&qs=1&log=0&applicationKey=myhcpcdgdh7907ggei7s5f4md"
        frameborder="0" allowfullscreen allow="vr; xr-spatial-tracking"
        style="position:fixed;top:0;left:0;width:100%;height:100%;z-index:1"></iframe>

    <script>
        const showcase = document.getElementById('showcase');
        let sdk;
        let mpSdk = null;         // alias semántico expuesto tras connect()

        // Animación GLB — variables de soporte para cubo
        let cuboAnimComp = null;
        let cuboClipName = '';
        let cuboMixer = null;
        let cuboActions = [];
        let cuboAnimMethod = 'none';
        let cuboAnimPlaying = false;

        // ── SISTEMA DE GESTIÓN DE MODELOS (FBX/GLB) ──
        const modelsData = {
            'electrico': { id: 'electrico', label: 'M. Eléctrico', icon: '⚡', file: 'Electrico.fbx', type: 'mp.fbxLoader', scale: 0.0126, node: null, visible: true },
            'clima': { id: 'clima', label: 'M. Clima', icon: '❄️', file: 'Clima.fbx', type: 'mp.fbxLoader', scale: 0.0126, node: null, visible: true },
            'radio': {
                id: 'radio', label: 'Radio', icon: '📻', file: 'Radio.fbx', type: 'mp.fbxLoader', scale: 0.05, node: null, visible: true,
                position: { x: -16, y: 1.2, z: -2.7 },
                rotation: { x: 0, y: 0, z: 0 }
            },
            'cubo': { id: 'cubo', label: 'Cubo Animado', icon: '📦', file: 'cubosdk.glb', type: 'mp.gltfLoader', scale: 0.1, node: null, visible: true },
            'mesa': { id: 'mesa', label: 'Mesa', icon: '🪑', file: 'Mesa.glb', type: 'mp.gltfLoader', scale: 1.0, node: null, visible: true },
            'candado': { id: 'candado', label: 'Candado', icon: '🔒', file: 'candado.glb', type: 'mp.gltfLoader', scale: 2.0, node: null, visible: true },
            'etiqueta': { id: 'etiqueta', label: 'Etiqueta', icon: '🏷️', file: 'Etiqueta.glb', type: 'mp.gltfLoader', scale: 2.0, node: null, visible: true },
            'pinzas': { id: 'pinzas', label: 'Pinzas', icon: '🔧', file: 'Pinzas.glb', type: 'mp.gltfLoader', scale: 2.0, node: null, visible: true }
        };

        // Mapa de calibración de tags: 'tag_1' → { sid, anchorPosition, stepLabel }
        const tagsCalibData = {};

        function initModelUI() {
            const select = document.getElementById('calib-model-select');

            // ─ Grupo: Modelos 3D ─
            const grpModels = document.createElement('optgroup');
            grpModels.label = '── Modelos 3D ──';
            select.appendChild(grpModels);

            Object.values(modelsData).forEach(model => {
                const opt = document.createElement('option');
                opt.value = model.id;
                opt.textContent = `${model.icon} ${model.label}`;
                grpModels.appendChild(opt);
            });

            // ─ Grupo: Tags (se llenará cuando el SDK cree los tags) ─
            const grpTags = document.createElement('optgroup');
            grpTags.label = '── Tags Checklist ──';
            grpTags.id = 'calib-tags-group';
            select.appendChild(grpTags);
        }

        // Llamado desde init SDK tras crear cada tag
        function registerTagForCalib(stepId, sid, label, anchorPosition) {
            const key = `tag_${stepId}`;
            tagsCalibData[key] = { sid, anchorPosition: Object.assign({}, anchorPosition), stepLabel: label };

            const grp = document.getElementById('calib-tags-group');
            if (!grp) return;
            // evitar duplicados
            if (grp.querySelector(`option[value="${key}"]`)) return;
            const opt = document.createElement('option');
            opt.value = key;
            opt.textContent = `📍 Paso ${stepId}: ${label.replace(/^Paso \d+: /, '')}`;
            grp.appendChild(opt);
        }

        function toggleSpecificModel(id) {
            const m = modelsData[id];
            if (!m || !m.node) return;
            m.visible = !m.visible;
            m.node.obj3D.visible = m.visible;
        }

        function getActiveModel() {
            const id = document.getElementById('calib-model-select').value;
            if (id.startsWith('tag_')) return null;  // es un tag, no un modelo
            return modelsData[id] || null;
        }

        function getActiveTag() {
            const id = document.getElementById('calib-model-select').value;
            if (!id.startsWith('tag_')) return null;
            return tagsCalibData[id] || null;
        }

        function nudgePos(axis, dir) {
            const step = parseFloat(document.getElementById('calib-step').value) || 0.1;

            const tag = getActiveTag();
            if (tag) {
                // Mover Mattertag
                tag.anchorPosition[axis] = (tag.anchorPosition[axis] || 0) + step * dir;
                if (!mpSdk) return;
                mpSdk.Mattertag.editPosition(tag.sid, {
                    anchorPosition: tag.anchorPosition,
                    stemVector: { x: 0, y: 0, z: 0 }
                }).catch(e => console.warn('⚠️ editPosition error:', e));
                updateCalibDisplay();
                return;
            }

            const m = getActiveModel();
            if (!m || !m.node) return;
            if (!m.visible) toggleSpecificModel(m.id);
            m.node.obj3D.position[axis] += (step * dir);
            updateCalibDisplay();
        }

        function nudgeRot(axis, dir) {
            const tag = getActiveTag();
            if (tag) return; // Los tags no tienen rotación editable

            const m = getActiveModel();
            if (!m || !m.node) return;
            if (!m.visible) toggleSpecificModel(m.id);

            const step = parseFloat(document.getElementById('calib-rot-step').value) || 5;
            m.node.obj3D.rotation[axis] += (step * dir * (Math.PI / 180));
            updateCalibDisplay();
        }

        function updateCalibDisplay() {
            const tag = getActiveTag();
            if (tag) {
                const p = tag.anchorPosition;
                document.getElementById('calib-coords').innerText =
                    `Pos: x: ${(p.x || 0).toFixed(3)}, y: ${(p.y || 0).toFixed(3)}, z: ${(p.z || 0).toFixed(3)}`;
                document.getElementById('calib-rot').innerText = `(Tags no tienen rotación)`;
                return;
            }

            const m = getActiveModel();
            if (!m || !m.node) return;

            const p = m.node.obj3D.position;
            const r = m.node.obj3D.rotation;

            document.getElementById('calib-coords').innerText = `Pos: x: ${p.x.toFixed(3)}, y: ${p.y.toFixed(3)}, z: ${p.z.toFixed(3)}`;
            document.getElementById('calib-rot').innerText = `Rot: x: ${(r.x * 180 / Math.PI).toFixed(0)}°, y: ${(r.y * 180 / Math.PI).toFixed(0)}°, z: ${(r.z * 180 / Math.PI).toFixed(0)}°`;
        }

        // Actualiza el estado visual (on/off) de un botón toggle
        function syncToggleBtn(id) {
            const m = modelsData[id];

        async function navigateToStep(index) {
            if (index < 0 || index >= checklistSteps.length) {
                isAdvancing = false;
                return;
            }

            const step = checklistSteps[index];
            const sweepId = step.coordinates && step.coordinates.sweep_id;
            const isRealSweep = sweepId && !sweepId.startsWith('SWEEP_ID_PASO');
            const tagSid = stepSidMap[step.id];

            console.log(`🚀 [Paso ${step.id}] sweep: ${sweepId} | tag: ${tagSid}`);

            // 1. Actualizar UI en 800ms (anti-bloqueo)
            setTimeout(() => {
                renderChecklistUI(index);
                isAdvancing = false;
            }, 800);

            if (!mpSdk) { console.warn('⚠️ SDK no disponible.'); return; }

            // 2a. PRIORIDAD: Sweep.moveTo cuando hay sweep_id real (vista exacta con rotación)
            if (isRealSweep) {
                const rot = (step.coordinates && step.coordinates.rotation) || { x: 0, y: 0 };
                console.log(`📍 Sweep.moveTo: "${sweepId}" | rot x:${rot.x} y:${rot.y}`);
                mpSdk.Sweep.moveTo(sweepId.trim(), {
                    rotation: { x: rot.x, y: rot.y },
                    transition: mpSdk.Sweep.Transition.FADEOUT,
                    transitionTime: 800
                })
                    .then(() => console.log('✅ Sweep.moveTo exitoso.'))
                    .catch(e => {
                        console.warn('⚠️ Sweep.moveTo falló, usando navigateTo:', e);
                        if (tagSid) mpSdk.Mattertag.navigateTo(tagSid).catch(console.error);
                    });
                return;
            }

            // 2b. Sin sweep calibrado: navegar al tag por SID
            if (tagSid) {
                console.log(`🎯 Mattertag.navigateTo: ${tagSid}`);
                mpSdk.Mattertag.navigateTo(tagSid)
                    .then(() => console.log('✅ navigateTo exitoso.'))
                    .catch(e => console.error('❌ navigateTo falló:', e));
            } else {
                console.warn(`⚠️ [Paso ${step.id}] Sin sweep ni tag SID disponible.`);
            }

         * @param {number} activeIndex  índice activo en checklistSteps (-1 = ocultar todo)
         * @param {boolean} forceHide   si true, oculta los modelos del activeIndex también
         */
        function setStepModels(activeIndex, forceHide = false) {
            // Mapa: id de paso → IDs de modelos que aparecen en ese paso
            const stepModels = {
                1: ['radio'],
                4: ['candado', 'etiqueta', 'pinzas']
            };

            const activeStep = checklistSteps[activeIndex];
            const activeStepId = activeStep ? activeStep.id : -1;

            Object.entries(stepModels).forEach(([stepIdStr, modelIds]) => {
                const stepId = parseInt(stepIdStr);
                const shouldShow = !forceHide && (stepId === activeStepId);

                modelIds.forEach(mid => {
                    const m = modelsData[mid];
                    if (!m || !m.node) return;

                    // Para modelos FBX grandes (Radio), el obj3D existe pero sus hijos
                    // pueden tardar en cargarse. Usamos polling hasta que esté listo.
                    const applyVisibility = (attempts = 0) => {
                        const obj = m.node.obj3D;
                        const isReady = obj && (obj.children.length > 0 || attempts > 40);
                        if (!isReady) {
                            setTimeout(() => applyVisibility(attempts + 1), 250);
                            return;
                        }
                        obj.visible = shouldShow;
                        m.visible = shouldShow;
                        console.log(`👁️ [${mid}] visible=${shouldShow} (intentos: ${attempts})`);
                    };
                    applyVisibility();
                });
            });
        }

                `;
                div.onclick = () => toggleItem(step.id, idx);

            const allChecked = checkState[step.id].every(Boolean);

            const radioM = modelsData.radio;
            const rS = radioM.scale;
            modelsData.radio.node = await sdk.Scene.createNode();
            modelsData.radio.node.addComponent('mp.fbxLoader', {
                url: radioM.file,
                visible: true,
                localScale: { x: rS, y: rS, z: rS },
                localPosition: radioM.position,
                localRotation: radioM.rotation
            });
            modelsData.radio.node.start();
            modelsData.radio.visible = true;
            console.log('📻 [Radio] FBX iniciando carga (~24MB):', radioM.position);

            // ── Ocultar modelos de paso tras cargar ──
            // Esperamos 500ms para que Three.js construya los obj3D antes de ocultarlos.
            // Radio es grande (24MB) — se oculta por nombre en cuanto el nodo exista.
            setTimeout(() => {
                setStepModels(-1); // -1 = ningún paso activo → ocultar todos los de paso
                console.log('🔴 [Init] Modelos de paso ocultados. Listos para activarse al navegar.');
            }, 500);

            // =====================================================
            // HELPERS: crear ícono numerado con canvas
            // =====================================================
            function makeNumberIcon(number, color) {
                const canvas = document.createElement('canvas');
                canvas.width = 128;
                canvas.height = 128;
                const ctx = canvas.getContext('2d');
                const cx = 64, cy = 64, r = 56;

                // Círculo de fondo con el color del paso
                const cr = Math.round(color.r * 255);
                const cg = Math.round(color.g * 255);
                const cb = Math.round(color.b * 255);
                ctx.beginPath();
                ctx.arc(cx, cy, r, 0, Math.PI * 2);
                ctx.fillStyle = `rgb(${cr}, ${cg}, ${cb})`;
                ctx.fill();

                // Borde blanco
                ctx.strokeStyle = 'rgba(255,255,255,0.9)';
                ctx.lineWidth = 6;
                ctx.stroke();

                // Número en blanco, centrado
                ctx.fillStyle = '#ffffff';
                ctx.font = 'bold 64px Arial, sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(number.toString(), cx, cy + 2);

                return canvas.toDataURL('image/png');
            }

            // =====================================================
            // AGREGAR TAGS DEL CHECKLIST CON sdk.Mattertag.add
            // =====================================================
            // ── CREAR MATTERTAGS DEL CHECKLIST ──────────────────────
            const tagSidMap = {}; // sid → stepId  (para el click handler)

            for (const step of checklistSteps) {
                try {
                    // 1. Ícono numerado (canvas → dataURL → SDK)
                    const iconId = `paso_num_${step.id}`;
                    const iconDataUrl = makeNumberIcon(step.id, step.color);
                    await sdk.Mattertag.registerIcon(iconId, iconDataUrl);

                    // 2. Crear el Mattertag
                    const [sid] = await sdk.Mattertag.add({
                        label: step.label,
                        description: '',
                        anchorPosition: step.anchorPosition,
                        stemVector: step.stemVector,
                        color: step.color
                    });

                    // 3. Poblar ambos mapas
                    tagSidMap[sid]       = step.id;  // sid → stepId  (click handler)
                    stepSidMap[step.id]  = sid;      // stepId → sid  (navigateToStep)

                    // 4. Aplicar ícono numerado
                    await sdk.Mattertag.editIcon(sid, iconId);

                    // 5. Registrar en el calibrador
                    registerTagForCalib(step.id, sid, step.label, step.anchorPosition);

                    console.log(`✅ Tag creado: "${step.label}" | sid: ${sid}`);
                } catch (e) {
                    console.error(`❌ Error creando tag paso ${step.id}:`, e);
                }
            }

            // ── CLICK en tag → abrir checklist ──────────────────────
            sdk.on(sdk.Mattertag.Event.CLICK, function (sid) {
                console.log('🔖 Tag clickeado, sid:', sid);
                const stepId = tagSidMap[sid];
                if (stepId !== undefined) openChecklist(stepId);
            });

            // ── preventAction: bloquear popup nativo del tag ────────
            for (const tagSid of Object.keys(tagSidMap)) {
                sdk.Mattertag.preventAction(tagSid, { opening: false })
                    .then(() => console.log(`✅ preventAction OK: ${tagSid}`))
                    .catch(e => console.warn(`preventAction no soportado (${tagSid}):`, e.message || e));
            }

            // ── Logger de posición (debug) ─────────────────────────
            sdk.Sweep.current.subscribe(function (currentSweep) {
                if (currentSweep && currentSweep.sid) {
                    console.log(`📍 SWEEP ACTUAL --> sid: "${currentSweep.sid}"`);
                }
            });

            // ── Logger de rotación de cámara (para calibrar vistas) ─
            sdk.Camera.pose.subscribe(function (pose) {
                if (pose && pose.rotation) {
                    const x = pose.rotation.x != null ? pose.rotation.x.toFixed(1) : '?';
                    const y = pose.rotation.y != null ? pose.rotation.y.toFixed(1) : '?';
                    console.log(`🎥 CAMARA rotation --> x: ${x} (pitch), y: ${y} (yaw)`);
                }
            });

            // Coordenadas al hacer click en el espacio
            sdk.Pointer.intersection.subscribe((intersection) => {
                console.log("📍 COORDENADAS EXACTAS ---> ", intersection.position);
            });
        });
    </script>
</body>
